name: Attach macOS DMG

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the DMG to
        required: true
        default: v0.1.4

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build universal macOS DMG
    runs-on: macos-26
    steps:
      - name: Check out released revision
        uses: actions/checkout@v4
        with:
          # A manual retry intentionally builds the current branch. This lets us
          # repair packaging without moving an already-published release tag.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build universal DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: >-
          npm run tauri -- build
          --target universal-apple-darwin
          --bundles dmg
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify Swift runtime search paths
        shell: bash
        run: |
          executable="src-tauri/target/universal-apple-darwin/release/bundle/macos/Secretary.app/Contents/MacOS/secretary"
          test -x "$executable"
          otool -l "$executable" | grep -A2 LC_RPATH | grep -q '/usr/lib/swift'
          otool -l "$executable" | grep -A2 LC_RPATH | grep -q '@executable_path/../Frameworks'

      - name: Attach DMG to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
