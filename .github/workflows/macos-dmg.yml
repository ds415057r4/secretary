name: Attach macOS DMG

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the DMG to
        required: true
        default: v0.1.4

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build universal macOS DMG
    runs-on: macos-26
    steps:
      - name: Check out released revision
        uses: actions/checkout@v4
        with:
          # A manual retry intentionally builds the current branch. This lets us
          # repair packaging without moving an already-published release tag.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build universal DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: >-
          npm run tauri -- build
          --target universal-apple-darwin
          --bundles dmg
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Repair and verify Swift runtime search paths
        shell: bash
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Secretary.app"
          executable="$app/Contents/MacOS/secretary"
          dmg_directory="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
          dmg_path="$(find "$dmg_directory" -maxdepth 1 -type f -name '*.dmg' -print -quit)"

          test -x "$executable"
          test -n "$dmg_path"

          rpaths="$(otool -l "$executable" | awk '/LC_RPATH/{getline; getline; print $2}')"
          if ! grep -Fxq '/usr/lib/swift' <<<"$rpaths"; then
            install_name_tool -add_rpath /usr/lib/swift "$executable"
          fi
          if ! grep -Fxq '@executable_path/../Frameworks' <<<"$rpaths"; then
            install_name_tool -add_rpath '@executable_path/../Frameworks' "$executable"
          fi

          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"

          verified_rpaths="$(otool -l "$executable" | awk '/LC_RPATH/{getline; getline; print $2}')"
          printf '%s\n' "$verified_rpaths"
          grep -Fxq '/usr/lib/swift' <<<"$verified_rpaths"
          grep -Fxq '@executable_path/../Frameworks' <<<"$verified_rpaths"

          staging="$(mktemp -d)"
          trap 'rm -rf "$staging"' EXIT
          cp -R "$app" "$staging/Secretary.app"
          ln -s /Applications "$staging/Applications"
          rm -f "$dmg_path"
          hdiutil create -volname Secretary -srcfolder "$staging" -ov -format UDZO "$dmg_path"

      - name: Attach DMG to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
